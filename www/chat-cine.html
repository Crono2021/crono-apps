<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f19">
    <title>Cineflix · Chat de Sala de Cine</title>
    <style>
        :root {
            --cinema-gold: #f59e0b;
            --cinema-gold-dark: #d97706;
            --bg-dark: #0b0f19;
            --bg-card: rgba(18, 24, 38, 0.95);
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #0b0f19 0%, #111827 100%);
            color: #f1f5f9;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        .chat-header {
            background: rgba(11, 15, 25, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(245, 158, 11, 0.3);
            padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .room-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--cinema-gold);
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .status-pill {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            flex-shrink: 0;
        }
        .status-pill.offline {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.3);
        }
        .status-pill.connecting {
            background: rgba(234, 179, 8, 0.15);
            color: #fde047;
            border-color: rgba(234, 179, 8, 0.3);
        }
        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .movie-title {
            color: #e2e8f0;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 70%;
        }
        .user-tag {
            color: #fbbf24;
            font-weight: 700;
            background: rgba(245, 158, 11, 0.15);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
        }

        /* ── Voting Banner ── */
        .voting-banner {
            background: linear-gradient(135deg, rgba(217, 119, 6, 0.2), rgba(15, 23, 42, 0.95));
            border-bottom: 1px solid rgba(245, 158, 11, 0.4);
            padding: 10px 14px;
            flex-shrink: 0;
            animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .voting-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 800;
            color: #f59e0b;
            margin-bottom: 8px;
        }
        .voting-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .candidate-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.15s;
        }
        .candidate-btn:active { transform: scale(0.97); }
        .candidate-btn.voted {
            background: rgba(245, 158, 11, 0.3);
            border-color: #f59e0b;
            color: #fbbf24;
            font-weight: 800;
        }
        .vote-count {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.7rem;
            margin-left: 4px;
        }

        /* ── Messages Feed ── */
        .chat-feed {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scrollbar-width: thin;
            scrollbar-color: rgba(245, 158, 11, 0.3) transparent;
        }
        .msg-bubble {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
            line-height: 1.35;
            word-break: break-word;
            animation: msgPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes msgPop { from { opacity: 0; transform: scale(0.92) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .msg-bubble.is-me {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(217, 119, 6, 0.3), rgba(245, 158, 11, 0.2));
            border-color: rgba(245, 158, 11, 0.4);
            border-bottom-right-radius: 4px;
        }
        .msg-bubble:not(.is-me) {
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 2px;
        }
        .msg-author {
            font-size: 0.75rem;
            font-weight: 800;
            color: #fbbf24;
        }
        .msg-bubble.is-me .msg-author {
            color: #fde047;
        }
        .msg-time {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.4);
        }
        .msg-text {
            color: #f8fafc;
        }
        .system-msg {
            align-self: center;
            font-size: 0.75rem;
            color: #94a3b8;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            text-align: center;
        }

        /* ── Reaction Bar ── */
        .reactions-bar {
            display: flex;
            gap: 8px;
            padding: 8px 16px;
            overflow-x: auto;
            background: rgba(11, 15, 25, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .reactions-bar::-webkit-scrollbar { display: none; }
        .reaction-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 1.25rem;
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
            flex-shrink: 0;
        }
        .reaction-btn:active {
            transform: scale(1.3);
        }

        /* ── Input Bar ── */
        .chat-input-bar {
            background: rgba(11, 15, 25, 0.98);
            border-top: 1px solid rgba(245, 158, 11, 0.3);
            padding: 10px 14px calc(env(safe-area-inset-bottom, 10px) + 8px);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        .chat-input {
            flex: 1;
            min-width: 0;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input:focus {
            border-color: var(--cinema-gold);
        }
        .chat-send-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: 24px;
            padding: 12px 20px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
            transition: transform 0.15s;
            flex-shrink: 0;
        }
        .chat-send-btn:active {
            transform: scale(0.95);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="chat-header">
        <div class="header-top">
            <div class="room-title">
                <span>🍿</span>
                <span id="room-name">Sala de Cine</span>
            </div>
            <span class="status-pill connecting" id="status-pill">Conectando…</span>
        </div>
        <div class="header-meta">
            <span class="movie-title" id="movie-title">🎬 En espera de sesión</span>
            <span class="user-tag" id="user-tag">👤 Cinéfilo</span>
        </div>
    </header>

    <!-- Voting Banner -->
    <div class="voting-banner hidden" id="voting-banner">
        <div class="voting-head">
            <span>🗳️ ¿Qué vemos? Vota en tu móvil</span>
            <span id="voting-timer">40s</span>
        </div>
        <div class="voting-grid" id="voting-candidates"></div>
    </div>

    <!-- Messages -->
    <div class="chat-feed" id="chat-feed">
        <div class="system-msg">🍿 Conectado a la sala. Los mensajes que envíes se verán en directo en la pantalla del cine.</div>
    </div>

    <!-- Quick reactions -->
    <div class="reactions-bar">
        <button type="button" class="reaction-btn" data-emoji="🍿">🍿</button>
        <button type="button" class="reaction-btn" data-emoji="👏">👏</button>
        <button type="button" class="reaction-btn" data-emoji="😂">😂</button>
        <button type="button" class="reaction-btn" data-emoji="🔥">🔥</button>
        <button type="button" class="reaction-btn" data-emoji="❤️">❤️</button>
        <button type="button" class="reaction-btn" data-emoji="😱">😱</button>
        <button type="button" class="reaction-btn" data-emoji="🤫">🤫</button>
        <button type="button" class="reaction-btn" data-emoji="💤">💤</button>
    </div>

    <!-- Input bar -->
    <form class="chat-input-bar" id="chat-form" onsubmit="return false;">
        <input type="text" id="chat-input" class="chat-input" placeholder="Comenta la película con la sala…" maxlength="60" autocomplete="off">
        <button type="submit" id="chat-send" class="chat-send-btn">Enviar</button>
    </form>

    <script>
    (function() {
        const ROOM_NAMES = {
            'bttf': 'Sala 1: Regreso al Futuro',
            'indy': 'Sala 2: Indiana Jones',
            'lotr': 'Sala 3: El Señor de los Anillos',
            'inter': 'Sala 4: Interstellar'
        };

        const params = new URLSearchParams(location.search);
        const roomId = params.get('room') || 'bttf';
        const clientKey = params.get('key') || params.get('userKey') || ('chat_' + Math.random().toString(36).slice(2, 12));
        const userName = params.get('name') || 'Cinéfilo';

        // DOM elements
        const roomNameEl = document.getElementById('room-name');
        const statusPillEl = document.getElementById('status-pill');
        const movieTitleEl = document.getElementById('movie-title');
        const userTagEl = document.getElementById('user-tag');
        const votingBannerEl = document.getElementById('voting-banner');
        const votingTimerEl = document.getElementById('voting-timer');
        const votingCandidatesEl = document.getElementById('voting-candidates');
        const chatFeedEl = document.getElementById('chat-feed');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');

        roomNameEl.textContent = ROOM_NAMES[roomId] || ('Sala ' + roomId);
        userTagEl.textContent = '👤 ' + userName;

        let ws = null;
        let pingTimer = null;
        let retryTimer = null;
        let retryCount = 0;
        let currentShow = null;
        let countdownTimer = null;

        function wsUrl() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = (location.host.includes('localhost') || location.host.includes('127.0.0.1') || location.protocol === 'file:')
                ? 'cineflixapp.duckdns.org'
                : location.host;
            return `${proto}//${host}/cine-ws`;
        }

        function setStatus(status, text) {
            statusPillEl.className = 'status-pill ' + status;
            statusPillEl.textContent = text;
        }

        function appendMessage({ author, text, time, isMe = false, isSystem = false }) {
            const div = document.createElement('div');
            if (isSystem) {
                div.className = 'system-msg';
                div.textContent = text;
            } else {
                div.className = 'msg-bubble ' + (isMe ? 'is-me' : '');
                const timeStr = time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                div.innerHTML = `
                    <div class="msg-header">
                        <span class="msg-author">${escapeHtml(author)}</span>
                        <span class="msg-time">${timeStr}</span>
                    </div>
                    <div class="msg-text">${escapeHtml(text)}</div>
                `;
            }
            chatFeedEl.appendChild(div);
            chatFeedEl.scrollTop = chatFeedEl.scrollHeight;
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function updateShow(s) {
            currentShow = s;
            clearInterval(countdownTimer);

            if (!s) return;

            if (s.phase === 'playing' && s.movie) {
                movieTitleEl.textContent = '🎬 «' + s.movie.title + '» (' + (s.movie.year || '') + ')';
                votingBannerEl.classList.add('hidden');
            } else if (s.phase === 'voting' && s.candidates && s.candidates.length) {
                movieTitleEl.textContent = '🗳️ Votando película…';
                votingBannerEl.classList.remove('hidden');
                renderVoting(s);

                const endsAt = s.endsAt || (Date.now() + 40000);
                const updateCountdown = () => {
                    const left = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
                    votingTimerEl.textContent = left + 's';
                    if (left <= 0) clearInterval(countdownTimer);
                };
                updateCountdown();
                countdownTimer = setInterval(updateCountdown, 1000);
            } else if (s.phase === 'loading' && s.movie) {
                movieTitleEl.textContent = '🍿 «' + s.movie.title + '» empieza en breve…';
                votingBannerEl.classList.add('hidden');
            } else {
                movieTitleEl.textContent = '🎬 En espera de sesión';
                votingBannerEl.classList.add('hidden');
            }
        }

        function renderVoting(s) {
            votingCandidatesEl.innerHTML = '';
            (s.candidates || []).forEach((c, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'candidate-btn ' + (s.myVote === idx ? 'voted' : '');
                const votes = (s.votes && s.votes[idx]) || 0;
                btn.innerHTML = `<span>${escapeHtml(c.title)}</span><span class="vote-count">${votes}</span>`;
                btn.onclick = () => {
                    if (ws && ws.readyState === 1) {
                        ws.send(JSON.stringify({ type: 'show_vote', i: idx }));
                        s.myVote = idx;
                        renderVoting(s);
                        if (navigator.vibrate) navigator.vibrate(30);
                    }
                };
                votingCandidatesEl.appendChild(btn);
            });

            // Reroll option
            const rerollIdx = (s.candidates || []).length;
            const btnReroll = document.createElement('button');
            btnReroll.type = 'button';
            btnReroll.className = 'candidate-btn ' + (s.myVote === rerollIdx ? 'voted' : '');
            const rVotes = (s.votes && s.votes[rerollIdx]) || 0;
            btnReroll.innerHTML = `<span>🔄 Pedir 4 distintas</span><span class="vote-count">${rVotes}</span>`;
            btnReroll.onclick = () => {
                if (ws && ws.readyState === 1) {
                    ws.send(JSON.stringify({ type: 'show_vote', i: rerollIdx }));
                    s.myVote = rerollIdx;
                    renderVoting(s);
                    if (navigator.vibrate) navigator.vibrate(30);
                }
            };
            votingCandidatesEl.appendChild(btnReroll);
        }

        function connect() {
            clearTimeout(retryTimer);
            clearInterval(pingTimer);
            setStatus('connecting', 'Conectando…');

            try {
                ws = new WebSocket(wsUrl());
            } catch (e) {
                scheduleReconnect();
                return;
            }

            ws.onopen = () => {
                retryCount = 0;
                setStatus('online', '🟢 En directo');
                ws.send(JSON.stringify({
                    type: 'join',
                    room: roomId,
                    clientKey: clientKey,
                    name: userName,
                    companion: true,
                    autoSit: true
                }));

                pingTimer = setInterval(() => {
                    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'ping', c: Date.now() }));
                }, 25000);
            };

            ws.onmessage = (ev) => {
                let m;
                try { m = JSON.parse(ev.data); } catch (e) { return; }

                switch (m.type) {
                    case 'joined': {
                        if (m.room && m.room.name) {
                            roomNameEl.textContent = m.room.name;
                        }
                        if (m.show) updateShow(m.show);
                        appendMessage({
                            text: `✓ Conectado a la sala. Hablas como ${userName}.`,
                            isSystem: true
                        });
                        break;
                    }
                    case 'say': {
                        // Solo texto real escrito por usuarios en el chat del móvil; ignorar frases ambientales
                        if (m.kind !== 'chat') break;
                        appendMessage({
                            author: m.name,
                            text: m.text,
                            isMe: (m.name || '').toLowerCase() === userName.toLowerCase()
                        });
                        if (navigator.vibrate) navigator.vibrate(25);
                        break;
                    }
                    case 'show': {
                        updateShow(m);
                        break;
                    }
                    case 'count': {
                        setStatus('online', `🟢 ${m.viewers || 1} en directo`);
                        break;
                    }
                    case 'error': {
                        appendMessage({
                            text: m.msg || 'Aviso',
                            isSystem: true
                        });
                        break;
                    }
                }
            };

            ws.onclose = () => {
                clearInterval(pingTimer);
                setStatus('offline', '🔴 Desconectado');
                scheduleReconnect();
            };

            ws.onerror = () => {};
        }

        function scheduleReconnect() {
            clearTimeout(retryTimer);
            const delay = Math.min(8000, 1000 * Math.pow(1.5, retryCount++));
            retryTimer = setTimeout(connect, delay);
        }

        // ── Mantener pantalla activa y reconexión inmediata al desbloquear ──
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                }
            } catch (_) {}
        }
        requestWakeLock();

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                requestWakeLock();
                if (!ws || ws.readyState > 1) {
                    connect();
                }
            }
        });
        window.addEventListener('focus', () => {
            if (!ws || ws.readyState > 1) {
                connect();
            }
        });

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'say', text }));
                chatInput.value = '';
                chatInput.focus();
                if (navigator.vibrate) navigator.vibrate(20);
            }
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            sendMessage();
        });
        chatSend.addEventListener('click', sendMessage);

        document.querySelectorAll('.reaction-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const emoji = btn.dataset.emoji;
                if (emoji && ws && ws.readyState === 1) {
                    ws.send(JSON.stringify({ type: 'say', text: emoji }));
                    if (navigator.vibrate) navigator.vibrate(30);
                }
            });
        });

        connect();
    })();
    </script>
</body>
</html>
