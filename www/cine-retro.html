<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cineflix 16-Bit • Salas de cine en directo (Versión Test)</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/cine/cine.css?v=20261010c">
    <link rel="stylesheet" href="/cine/room.css?v=20261010c">
</head>
<body>

    <!-- Cabecera -->
    <header class="retro-header">
        <div class="brand-container">
            <span class="brand-badge">🍿 CINEFLIX</span>
            <span class="brand-sub">16-Bit</span>
        </div>

        <nav class="tabs-nav">
            <button id="btn-tab-lobby" class="tab-btn active" onclick="goLobby()">
                <span>🎟️</span> <span>Cartelera</span>
            </button>
            <button id="btn-tab-creator" class="tab-btn" onclick="switchView('creator')">
                <span>🎨</span> <span>Personaje</span>
            </button>
        </nav>

        <div class="header-actions">
            <button id="btn-sound" class="icon-btn" onclick="toggleSound()" title="Efectos de sonido (no hay audio de las películas)">
                <span id="sound-icon">🔈</span> <span id="sound-text" class="btn-text">Efectos OFF</span>
            </button>
            <a href="/" class="icon-btn" style="text-decoration: none; color: #ecf0f1;" title="Volver a Cineflix">
                <span>⬅️</span> <span class="btn-text">Volver</span>
            </a>
        </div>
    </header>

    <main class="workspace">

        <!-- VISTA 1: CARTELERA (lobby con las 4 salas) -->
        <section id="view-lobby">
            <div class="lobby-inner">
                <div class="lobby-me">
                    <div class="lobby-me-avatar"><canvas id="lobby-avatar-canvas" width="72" height="96"></canvas></div>
                    <div class="lobby-me-info">
                        <div class="lobby-me-name" id="lobby-me-name">Cinéfilo</div>
                        <div class="lobby-me-hint">Elige una sala y siéntate: los demás te verán en tu butaca, en directo.</div>
                    </div>
                    <button class="btn-secondary lobby-edit-btn" onclick="switchView('creator')">🎨 Editar personaje</button>
                </div>

                <h2 class="lobby-title">🎞️ Cartelera</h2>
                <div class="lobby-grid" id="lobby-grid"></div>
            </div>
        </section>

        <!-- VISTA 2: LA SALA DE CINE COMPARTIDA -->
        <section id="view-cinema" class="hidden">
            <div class="room-bar">
                <button class="room-back" onclick="leaveToLobby()">← Cartelera</button>
                <div class="room-title" id="room-title">Sala</div>
                <div class="room-status" id="room-status">⚪ …</div>
                <div class="room-count" id="room-count">👥 0</div>
            </div>

            <div class="cinema-viewport-container">
                <div class="cinema-wrapper" id="cinema-wrapper">
                    <div class="room-stage" id="room-stage">
                        <canvas id="cinema-canvas" width="960" height="540"></canvas>
                        <div class="bubble-container" id="bubble-layer"></div>
                        <div class="seat-tip hidden" id="seat-tip"></div>
                    </div>
                </div>

                <div class="cinema-hud">
                    <div class="hud-avatar" title="Tu personaje">
                        <canvas id="hud-avatar-canvas" width="64" height="64"></canvas>
                    </div>
                    <input type="text" id="hud-chat-input" class="hud-input" placeholder="Escribe algo y tu personaje lo dirá en voz alta…" maxlength="60" autocomplete="off">
                    <button class="hud-btn" id="hud-send" onclick="sendChat()"><span>💬</span> Decir</button>
                </div>

                <div class="room-tools">
                    <button class="tool-btn" id="tool-sit" onclick="toggleSit()">🪑 Sentarme</button>
                    <label class="tool-seat">Butaca nº
                        <input type="number" id="seat-input" min="1" max="32" inputmode="numeric" placeholder="1-32">
                    </label>
                    <button class="tool-btn" onclick="sitAtNumber()">Ir</button>
                    <button class="tool-btn" id="tool-bubbles" onclick="toggleBubbles()">💬 Burbujas: ON</button>
                    <button class="tool-btn" id="tool-names" onclick="toggleNames()">🏷️ Nombres: OFF</button>
                </div>
            </div>
        </section>

        <!-- VISTA 3: CREADOR DE PERSONAJE -->
        <section id="view-creator" class="hidden">
            <div class="creator-preview-panel">
                <div class="character-stage">
                    <canvas id="preview-canvas" width="240" height="240"></canvas>
                </div>
                <div class="character-card-name" id="preview-name">Cinéfilo</div>
                <div class="character-quote-preview" id="preview-quote"></div>

                <button class="btn-primary" id="btn-save-char" onclick="saveCharacter()">
                    <span>💾</span> Guardar personaje
                </button>
                <button class="btn-secondary" onclick="randomizeCharacter()" style="margin-top: 6px;">
                    <span>🎲</span> Aleatorio
                </button>
                <button class="btn-secondary" onclick="exportAvatarPNG()">
                    <span>📥</span> Descargar sprite PNG
                </button>
            </div>

            <div class="creator-options-panel">
                <div class="section-title">
                    <span>1. Identidad</span>
                    <span class="badge">Se ve en la sala</span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="input-char-name">Nombre de tu personaje (por defecto, el de tu perfil de Cineflix)</label>
                        <input type="text" id="input-char-name" class="form-input" maxlength="16" oninput="updateProfileMeta()">
                    </div>
                    <div class="form-group">
                        <label for="input-char-quote">Tu frase (opcional; la dirá de vez en cuando)</label>
                        <input type="text" id="input-char-quote" class="form-input" maxlength="60" oninput="updateProfileMeta()" placeholder="Déjalo vacío para frases aleatorias">
                    </div>
                </div>

                <div id="creator-sections"></div>
            </div>
        </section>

    </main>

    <div class="toast hidden" id="toast"></div>
    <div class="overlay hidden" id="overlay">
        <div class="overlay-box">
            <div id="overlay-text"></div>
            <button class="btn-primary" onclick="location.reload()">Volver a entrar</button>
        </div>
    </div>

    <script src="/cine/sprite.js?v=20261010c"></script>
    <script src="/cine/audio.js?v=20261010c"></script>
    <script src="/cine/scenes.js?v=20261010c"></script>
    <script src="/cine/app.js?v=20261010c"></script>
    <script src="/cine/tv.js?v=20261010c"></script>
</body>
</html>
