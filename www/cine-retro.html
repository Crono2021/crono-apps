<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cineflix 16-Bit • La Sala & Creador RPG (Versión Test)</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-bg: #06080d;
            --cinema-red: #c0392b;
            --cinema-darkred: #781d14;
            --cinema-gold: #f39c12;
            --cinema-carpet: #4a1515;
            --ui-bg: rgba(13, 17, 26, 0.95);
            --ui-border: #2a3447;
            --accent-green: #2ecc71;
            --accent-blue: #3498db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--pixel-bg);
            color: #ecf0f1;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Bar */
        .retro-header {
            height: 54px;
            background: linear-gradient(180deg, #161c28 0%, #0d111a 100%);
            border-bottom: 2px solid #232c3d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            flex-shrink: 0;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            color: #e74c3c;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 1px;
        }

        .brand-sub {
            background: rgba(243, 156, 18, 0.15);
            color: var(--cinema-gold);
            border: 1px solid rgba(243, 156, 18, 0.4);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tabs-nav {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background: #1e2636;
            color: #95a5a6;
            border: 1px solid #2f3b52;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab-btn:hover {
            background: #283347;
            color: #fff;
            border-color: #4a5b7d;
        }

        .tab-btn.active {
            background: linear-gradient(180deg, #c0392b 0%, #962d22 100%);
            color: #fff;
            border-color: #e74c3c;
            box-shadow: 0 2px 8px rgba(192, 57, 43, 0.4);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            background: #1a2230;
            border: 1px solid #2d384c;
            color: #bdc3c7;
            padding: 7px 11px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: #253145;
            color: #fff;
        }

        .icon-btn.active {
            background: rgba(46, 204, 113, 0.2);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        /* Main Workspace Container */
        .workspace {
            position: relative;
            flex: 1;
            width: 100%;
            height: calc(100vh - 54px);
            overflow: hidden;
            display: flex;
        }

        /* VIEW 1: THE VIRTUAL CINEMA ROOM */
        #view-cinema {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: #040508;
        }

        .cinema-viewport-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #020305;
            padding: 8px 12px 64px 12px;
        }

        .cinema-wrapper {
            position: relative;
            width: min(96vw, calc((100vh - 120px) * 16 / 9));
            aspect-ratio: 16 / 9;
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.95);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #1a2232;
            background: #000;
        }

        #cinema-canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        /* CRISP DOM VECTOR SPEECH BUBBLE LAYER */
        .bubble-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 40;
        }

        .pixel-bubble {
            position: absolute;
            background: #ffffff;
            color: #0f172a;
            padding: 7px 11px;
            border-radius: 6px;
            font-size: clamp(11px, 1.2vw, 13px);
            font-weight: 600;
            line-height: 1.35;
            max-width: min(280px, 42vw);
            box-shadow: 0 8px 24px rgba(0,0,0,0.65), 0 0 0 2px #0f172a;
            transform: translate(-50%, -100%);
            pointer-events: auto;
            animation: bubblePop 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .pixel-bubble.fade-out {
            opacity: 0;
            transform: translate(-50%, -110%) scale(0.9);
        }

        .pixel-bubble::after {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 7px 6px 0 6px;
            border-style: solid;
            border-color: #ffffff transparent transparent transparent;
        }

        .pixel-bubble::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 9px 7px 0 7px;
            border-style: solid;
            border-color: #0f172a transparent transparent transparent;
        }

        .bubble-speaker {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: #c0392b;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.5px;
        }

        .bubble-text {
            word-break: break-word;
        }

        @keyframes bubblePop {
            0% { transform: translate(-50%, -80%) scale(0.8); opacity: 0; }
            100% { transform: translate(-50%, -100%) scale(1); opacity: 1; }
        }

        /* Live Chat / Quote Overlay Bar at Bottom */
        .cinema-hud {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(13, 17, 26, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 7px 14px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            z-index: 50;
            width: 92%;
            max-width: 660px;
        }

        .hud-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #1e2636;
            border: 2px solid var(--cinema-gold);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        #hud-avatar-canvas {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
        }

        .hud-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid #2d384c;
            border-radius: 20px;
            padding: 8px 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }

        .hud-input:focus {
            border-color: var(--cinema-gold);
            background: rgba(0, 0, 0, 0.65);
        }

        .hud-btn {
            background: linear-gradient(180deg, #f39c12 0%, #d68910 100%);
            border: none;
            color: #0b0e14;
            font-weight: 700;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .hud-btn:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
        }

        .hud-stats {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* VIEW 2: THE 16-BIT CHARACTER STUDIO */
        #view-creator {
            position: absolute;
            inset: 0;
            display: flex;
            background: radial-gradient(circle at 30% 50%, #151c28 0%, #080b11 100%);
            overflow-y: auto;
            padding: 24px;
            gap: 28px;
            z-index: 10;
        }

        .creator-preview-panel {
            flex: 0 0 340px;
            background: rgba(18, 24, 35, 0.88);
            border: 1px solid #2a3447;
            border-radius: 14px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
        }

        .character-stage {
            width: 240px;
            height: 240px;
            background: #070a10;
            border: 3px solid #34495e;
            border-radius: 12px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 20px rgba(243, 156, 18, 0.15);
            background-image: 
                radial-gradient(rgba(243, 156, 18, 0.15) 15%, transparent 16%),
                radial-gradient(rgba(255, 255, 255, 0.05) 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            overflow: hidden;
        }

        #preview-canvas {
            display: block;
            width: 240px;
            height: 240px;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        .character-card-name {
            font-family: 'Press Start 2P', monospace;
            font-size: 13px;
            color: var(--cinema-gold);
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0 #000;
        }

        .character-quote-preview {
            background: rgba(0,0,0,0.45);
            border: 1px dashed rgba(243, 156, 18, 0.35);
            border-radius: 8px;
            padding: 10px 14px;
            color: #cbd5e1;
            font-style: italic;
            font-size: 13px;
            text-align: center;
            width: 100%;
            margin-bottom: 20px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .creator-options-panel {
            flex: 1;
            background: rgba(18, 24, 35, 0.88);
            border: 1px solid #2a3447;
            border-radius: 14px;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #ecf0f1;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #2a3447;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title span.badge {
            background: rgba(52, 152, 219, 0.2);
            color: var(--accent-blue);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 10px;
        }

        .palette-grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .color-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.15s;
        }

        .color-circle:hover {
            transform: scale(1.15);
        }

        .color-circle.selected {
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        .choice-btn {
            background: #131924;
            border: 1px solid #283347;
            border-radius: 8px;
            padding: 10px 6px;
            color: #bdc3c7;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .choice-btn .choice-icon {
            font-size: 20px;
        }

        .choice-btn:hover {
            background: #1c2637;
            border-color: #4a5d80;
            color: #fff;
        }

        .choice-btn.selected {
            background: rgba(243, 156, 18, 0.15);
            border-color: var(--cinema-gold);
            color: var(--cinema-gold);
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.2);
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
        }

        .form-input {
            background: #121824;
            border: 1px solid #283347;
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            font-family: inherit;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--cinema-gold);
        }

        .btn-primary {
            background: linear-gradient(180deg, #c0392b 0%, #962d22 100%);
            border: 1px solid #e74c3c;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(192, 57, 43, 0.4);
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #1f2838;
            border: 1px solid #34435e;
            color: #bdc3c7;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: #2a374d;
            color: #fff;
        }

        .hidden {
            display: none !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: #2c3e50;
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            .retro-header {
                height: 48px;
                padding: 0 10px;
            }
            .brand-badge {
                font-size: 10px;
                letter-spacing: 0px;
            }
            .brand-sub {
                display: none;
            }
            .tab-btn {
                padding: 6px 10px;
                font-size: 12px;
            }
            .tab-btn .tab-full-text {
                display: none;
            }
            .icon-btn .btn-text {
                display: none;
            }
            .icon-btn {
                padding: 6px 8px;
            }
            #view-creator {
                flex-direction: column;
                padding: 12px;
            }
            .creator-preview-panel {
                flex: none;
                width: 100%;
            }
            .form-row {
                flex-direction: column;
            }
            .cinema-viewport-container {
                padding: 6px 6px 54px 6px;
            }
            .cinema-hud {
                bottom: 8px;
                padding: 6px 10px;
                gap: 8px;
                width: 95%;
            }
            .hud-stats {
                display: none;
            }
            .hud-input {
                font-size: 12px;
                padding: 6px 10px;
            }
            .hud-btn {
                padding: 6px 12px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="retro-header">
        <div class="brand-container">
            <span class="brand-badge">🍿 CINEFLIX</span>
            <span class="brand-sub">16-Bit</span>
        </div>

        <nav class="tabs-nav">
            <button id="btn-tab-cinema" class="tab-btn active" onclick="switchView('cinema')">
                <span>🪑</span> <span>Sala<span class="tab-full-text"> de Cine</span></span>
            </button>
            <button id="btn-tab-creator" class="tab-btn" onclick="switchView('creator')">
                <span>🎨</span> <span>Creador<span class="tab-full-text"> RPG</span></span>
            </button>
        </nav>

        <div class="header-actions">
            <button id="btn-sound" class="icon-btn" onclick="toggleSound()" title="Activar/Desactivar sonido">
                <span id="sound-icon">🔈</span> <span id="sound-text" class="btn-text">Mudo</span>
            </button>
            <button class="icon-btn" onclick="triggerRandomEvent()" title="Evento aleatorio en la sala">
                <span>⚡</span> <span class="btn-text">Evento</span>
            </button>
            <a href="/" class="icon-btn" style="text-decoration: none; color: #ecf0f1;" title="Volver a Cineflix">
                <span>⬅️</span> <span class="btn-text">Volver</span>
            </a>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">

        <!-- VIEW 1: THE VIRTUAL RETRO CINEMA -->
        <section id="view-cinema">
            <div class="cinema-viewport-container">
                <div class="cinema-wrapper">
                    <!-- Crisp Native 960x540 Resolution -->
                    <canvas id="cinema-canvas" width="960" height="540"></canvas>
                    <!-- Crisp Vector DOM Speech Bubbles Layer -->
                    <div class="bubble-container" id="bubble-layer"></div>
                </div>

                <!-- Floating Chat & Interaction HUD -->
                <div class="cinema-hud">
                    <div class="hud-avatar" title="Tu avatar pixel-art">
                        <canvas id="hud-avatar-canvas" width="64" height="64"></canvas>
                    </div>
                    <input type="text" id="hud-chat-input" class="hud-input" placeholder="Escribe lo que dice tu personaje en el cine..." maxlength="60">
                    <button class="hud-btn" onclick="sendCustomQuote()">
                        <span>💬</span> Soltar frase
                    </button>
                    <div class="hud-stats" id="hud-stats-label">👥 8 en sala</div>
                </div>
            </div>
        </section>

        <!-- VIEW 2: THE 16-BIT CHARACTER STUDIO -->
        <section id="view-creator" class="hidden">
            <!-- Left: Character Card & Actions -->
            <div class="creator-preview-panel">
                <div class="character-stage">
                    <!-- Crisp 240x240 Character Preview -->
                    <canvas id="preview-canvas" width="240" height="240"></canvas>
                </div>
                <div class="character-card-name" id="preview-name">Crono</div>
                <div class="character-quote-preview" id="preview-quote">
                    "Callaos todos que empieza la película 🤫"
                </div>

                <button class="btn-primary" onclick="saveAndEnterCinema()">
                    <span>💾</span> Guardar y entrar al Cine
                </button>
                <button class="btn-secondary" onclick="exportAvatarPNG()">
                    <span>📥</span> Descargar Sprite PNG
                </button>
                <button class="btn-secondary" onclick="randomizeCharacter()" style="margin-top: 6px;">
                    <span>🎲</span> Aleatorio
                </button>
            </div>

            <!-- Right: Customization Controls -->
            <div class="creator-options-panel">
                <!-- Identity -->
                <div class="section-title">
                    <span>1. Identidad de Cineasta</span>
                    <span class="badge">Perfil</span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="input-char-name">Nombre / Alias en Telegram</label>
                        <input type="text" id="input-char-name" class="form-input" value="Crono" maxlength="16" oninput="updateProfileMeta()">
                    </div>
                    <div class="form-group">
                        <label for="input-char-quote">Frase Célebre del Grupo</label>
                        <input type="text" id="input-char-quote" class="form-input" value="Callaos todos que empieza la película 🤫" maxlength="60" oninput="updateProfileMeta()">
                    </div>
                </div>

                <!-- Base Archetype & Skin -->
                <div class="section-title">
                    <span>2. Arquetipo & Tono de Piel</span>
                </div>
                <div class="palette-grid" id="skin-palette"></div>

                <!-- Hair Style & Color -->
                <div class="section-title">
                    <span>3. Peinado</span>
                </div>
                <div class="option-grid" id="hair-style-grid"></div>

                <label style="font-size: 12px; font-weight: 600; color: #94a3b8; margin-top: 4px;">Color de pelo:</label>
                <div class="palette-grid" id="hair-palette"></div>

                <!-- Clothing & Colors -->
                <div class="section-title">
                    <span>4. Ropa Superior</span>
                </div>
                <div class="option-grid" id="top-style-grid"></div>

                <label style="font-size: 12px; font-weight: 600; color: #94a3b8; margin-top: 4px;">Color del atuendo:</label>
                <div class="palette-grid" id="top-palette"></div>

                <!-- Accessories -->
                <div class="section-title">
                    <span>5. Accesorio de Cine & Rol</span>
                </div>
                <div class="option-grid" id="accessory-grid"></div>
            </div>
        </section>

    </main>

    <script>
        /* =========================================================================
           STATE & CONSTANTS
           ========================================================================= */

        const DEFAULT_AVATAR = {
            name: 'Crono',
            quote: 'Callaos todos que empieza la película 🤫',
            skin: '#ffcc99',
            hairStyle: 'messy',
            hairColor: '#3a2518',
            topStyle: 'cineflix_tee',

        // Sound System (Synthesized Web Audio API)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBlip(freq = 440, type = 'square', duration = 0.08) {
            if (!isSoundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

            if (!isSoundEnabled) return;

        // Color helper to shade pixels
        function adjustColor(hex, amt) {
            let usePound = false;
            if (hex[0] === '#') { hex = hex.slice(1); usePound = true; }
            let num = parseInt(hex, 16);
            let r = (num >> 16) + amt;
            let b = ((num >> 8) & 0x00FF) + amt;
            let g = (num & 0x0000FF) + amt;
            r = Math.max(Math.min(255, r), 0);
            b = Math.max(Math.min(255, b), 0);
            g = Math.max(Math.min(255, g), 0);
            return (usePound ? '#' : '') + (g | (b << 8) | (r << 16)).toString(16).padStart(6, '0');
        }

        function drawCinemaSala(ctx, time) {
            const w = 960;
            const h = 540;

            // Background
            ctx.fillStyle = '#080a10';
            ctx.fillRect(0, 0, w, h);

            // Wooden Art-Deco Wall Panels
            const wallW = 110;
            ctx.fillStyle = '#16131c';
            ctx.fillRect(0, 0, wallW, h);
            ctx.fillStyle = '#231e2d';
            for (let i = 0; i < 6; i++) {
                ctx.fillRect(15, 35 + i * 82, 80, 60);
                ctx.fillStyle = '#120f18';
                ctx.fillRect(20, 40 + i * 82, 70, 50);
                ctx.fillStyle = '#231e2d';
            }
            // Right Wall
            ctx.fillRect(w - wallW, 0, wallW, h);
            for (let i = 0; i < 6; i++) {
                ctx.fillRect(w - wallW + 15, 35 + i * 82, 80, 60);
                ctx.fillStyle = '#120f18';
                ctx.fillRect(w - wallW + 20, 40 + i * 82, 70, 50);
                ctx.fillStyle = '#231e2d';
            }

            // Glowing Vintage Sconces
            function drawSconce(x, y) {
                ctx.fillStyle = '#d97706';
                ctx.fillRect(x - 4, y, 8, 14);
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(x - 6, y - 10, 12, 10);

                const grad = ctx.createRadialGradient(x, y - 5, 2, x, y - 5, 45);
                grad.addColorStop(0, 'rgba(251, 191, 36, 0.4)');
                grad.addColorStop(1, 'rgba(251, 191, 36, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y - 5, 45, 0, Math.PI * 2);
                ctx.fill();
            }
            drawSconce(55, 110);
            drawSconce(55, 270);
            drawSconce(w - 55, 110);
            drawSconce(w - 55, 270);

            // Neon EXIT Signs
            ctx.fillStyle = '#064e3b';
            ctx.fillRect(35, 25, 45, 18);
            ctx.fillRect(w - 80, 25, 45, 18);
            ctx.font = 'bold 8px "Press Start 2P", monospace';
            ctx.fillStyle = '#34d399';
            ctx.fillText('SALIDA', 39, 38);
            ctx.fillText('SALIDA', w - 76, 38);

            // Carpet Floor
            ctx.fillStyle = '#260a0f';
            ctx.fillRect(wallW, 240, w - wallW * 2, h - 240);

            // Red Carpet Center Aisle
            ctx.beginPath();
            ctx.moveTo(430, 240);
            ctx.lineTo(530, 240);
            ctx.lineTo(565, h);
            ctx.lineTo(395, h);
            ctx.closePath();
            ctx.fillStyle = '#7f1d1d';
            ctx.fill();

            // Gold borders on carpet
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(430, 240);
            ctx.lineTo(395, h);
            ctx.moveTo(530, 240);
            ctx.lineTo(565, h);
            ctx.stroke();

            // Diamond carpet pattern
            ctx.fillStyle = 'rgba(245, 158, 11, 0.12)';
            for (let cy = 260; cy < h; cy += 35) {
                const spread = (cy - 240) * 0.15;
                ctx.fillRect(475 - spread, cy, 10, 10);
                ctx.fillRect(475 + spread, cy, 10, 10);
            }

            // ==========================================
            // THE MOVIE SCREEN
            // ==========================================
            const scrX = 170;
            const scrY = 20;
            const scrW = 620;
            const scrH = 210;

            // Outer Screen Frame
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(scrX - 8, scrY - 8, scrW + 16, scrH + 16);
            ctx.fillStyle = '#334155';
            ctx.fillRect(scrX - 4, scrY - 4, scrW + 8, scrH + 8);

            ctx.save();
            ctx.beginPath();
            ctx.rect(scrX, scrY, scrW, scrH);
            ctx.clip();

            // Space Background
            ctx.fillStyle = '#030712';
            ctx.fillRect(scrX, scrY, scrW, scrH);

            // Stars
            const starSpeed = (time * 0.05) % scrW;
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 50; i++) {
                const sx = scrX + ((i * 37 + starSpeed * (i % 3 + 1)) % scrW);
                const sy = scrY + ((i * 23) % scrH);
                const sz = (i % 3 === 0) ? 2 : 1;
                ctx.fillRect(sx, sy, sz, sz);
            }

            // Retro Sci-Fi Planet with Rings
            const planetX = scrX + 440;
            const planetY = scrY + 85;
            const pGrad = ctx.createLinearGradient(planetX - 35, planetY - 35, planetX + 35, planetY + 35);
            pGrad.addColorStop(0, '#f97316');
            pGrad.addColorStop(0.5, '#ea580c');
            pGrad.addColorStop(1, '#7c2d12');
            ctx.fillStyle = pGrad;
            ctx.beginPath();
            ctx.arc(planetX, planetY, 30, 0, Math.PI * 2);
            ctx.fill();

            // Planet Ring
            ctx.strokeStyle = 'rgba(254, 215, 170, 0.7)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.ellipse(planetX, planetY, 52, 13, -0.25, 0, Math.PI * 2);
            ctx.stroke();

            // Spaceship flying across
            const shipX = scrX + ((time * 0.12) % (scrW + 100)) - 50;
            const shipY = scrY + 65 + Math.sin(time * 0.003) * 14;
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(shipX - 12, shipY + 2, 8, 4);
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(shipX - 6, shipY + 3, 5, 2);
            ctx.fillStyle = '#06b6d4';
            ctx.fillRect(shipX, shipY, 20, 8);
            ctx.fillRect(shipX + 8, shipY - 3, 8, 4);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(shipX + 18, shipY + 2, 6, 4);

            // Scanlines & Movie Letterbox
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            for (let y = scrY; y < scrY + scrH; y += 4) {
                ctx.fillRect(scrX, y, scrW, 1);
            }
            ctx.fillStyle = '#000000';
            ctx.fillRect(scrX, scrY, scrW, 12);
            ctx.fillRect(scrX, scrY + scrH - 12, scrW, 12);

            ctx.font = '8px "Press Start 2P", monospace';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.fillText('CINEFLIX STUDIOS • ESTRENO EXCLUSIVO', scrX + 16, scrY + scrH - 3);

            ctx.restore();

            // Volumetric Projector Beam
            const projBeam = ctx.createLinearGradient(480, 0, 480, scrY + scrH);
            projBeam.addColorStop(0, 'rgba(224, 242, 254, 0.35)');
            projBeam.addColorStop(1, 'rgba(224, 242, 254, 0.02)');
            ctx.fillStyle = projBeam;
            ctx.beginPath();
            ctx.moveTo(460, 0);
            ctx.lineTo(500, 0);
            ctx.lineTo(scrX + scrW, scrY + scrH);
            ctx.lineTo(scrX, scrY + scrH);
            ctx.closePath();
            ctx.fill();

            // Velvet Curtains
            const curtainW = 60;
            const cGradL = ctx.createLinearGradient(scrX - curtainW, 0, scrX + 10, 0);
            cGradL.addColorStop(0, '#581c1c');
            cGradL.addColorStop(0.5, '#991b1b');
            cGradL.addColorStop(1, '#450a0a');
            ctx.fillStyle = cGradL;
            ctx.fillRect(scrX - curtainW, scrY - 15, curtainW + 10, scrH + 30);
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(scrX + 6, scrY - 15, 3, scrH + 30);

            const cGradR = ctx.createLinearGradient(scrX + scrW - 10, 0, scrX + scrW + curtainW, 0);
            cGradR.addColorStop(0, '#450a0a');
            cGradR.addColorStop(0.5, '#991b1b');
            cGradR.addColorStop(1, '#581c1c');
            ctx.fillStyle = cGradR;
            ctx.fillRect(scrX + scrW - 10, scrY - 15, curtainW + 10, scrH + 30);
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(scrX + scrW - 9, scrY - 15, 3, scrH + 30);

            // Top Valance Drape
            ctx.fillStyle = '#7f1d1d';
            ctx.fillRect(scrX - curtainW, scrY - 15, scrW + curtainW * 2, 18);
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(scrX - curtainW, scrY + 3, scrW + curtainW * 2, 3);

            // ==========================================
            // SEATS & AUDIENCE
            // ==========================================
            function drawVelvetSeat(x, y, occ = null) {
                const sw = 56;
                const sh = 42;

                ctx.fillStyle = '#1e0508';
                ctx.fillRect(x - 2, y - 2, sw + 4, sh + 4);
                ctx.fillStyle = '#831843';
                ctx.fillRect(x, y, sw, sh);
                ctx.fillStyle = '#9d174d';
                ctx.fillRect(x + 4, y + 4, sw - 8, sh - 14);

                ctx.fillStyle = '#500724';
                ctx.fillRect(x + 16, y + 10, 2, 10);
                ctx.fillRect(x + 36, y + 10, 2, 10);

                ctx.fillStyle = '#261b17';
                ctx.fillRect(x - 6, y + 14, 6, 26);
                ctx.fillRect(x + sw, y + 14, 6, 26);
                ctx.fillStyle = '#d97706';
                ctx.fillRect(x - 5, y + 14, 4, 3);
                ctx.fillRect(x + sw + 1, y + 14, 4, 3);

                ctx.fillStyle = '#701a35';
                ctx.fillRect(x - 2, y + sh - 8, sw + 4, 18);
            }

            // Draw all seats and their occupants
            SEATS.forEach(seat => {
                drawVelvetSeat(seat.x, seat.y, seat.occ);

                if (seat.occ) {
                    const charX = seat.x + 4;
                    const charY = seat.y - 18;
                    const isChewing = (Math.floor(time / 450) % 2 === 0) && (seat.occ.accessory === 'popcorn');
                    const blink = (Math.floor(time / 2500) % 7 === 0);

                    draw16BitCharacterCrisp(ctx, seat.occ, charX, charY, 2, {
                        isSitting: true,
                        isChewing: isChewing,
                        blink: blink
                    });
                }
            });

            // Draw walking characters (e.g. going to bathroom)
            [myCharacter, ...COMMUNITY_CHARACTERS].forEach(c => {
                if (c.state && c.state.startsWith('walking')) {
                    const walkAnim = Math.floor(time / 150) % 4;
                    draw16BitCharacterCrisp(ctx, c, c.x - 24, c.y - 48, 2, {
                        isSitting: false,
                        animFrame: walkAnim,
                        blink: false
                    });
                }
            });
        }

        /* =========================================================================
           CRISP VECTOR DOM SPEECH BUBBLE SYSTEM
           ========================================================================= */

        const bubbleLayer = document.getElementById('bubble-layer');

        function triggerSpeech(char, text, durationMs = 4500) {
            // Find character position
            let posX = char.x || 480;
            let posY = char.y || 400;

            if (char.seatIndex !== undefined) {
                const s = SEATS[char.seatIndex];
                if (s) {
                    posX = s.x + 28;
                    posY = s.y - 18;
                }
            }

            // Remove existing bubble for this character
            const existing = document.getElementById('bubble-' + char.name.replace(/\s+/g, '-'));
            if (existing) existing.remove();

            const b = document.createElement('div');
            b.id = 'bubble-' + char.name.replace(/\s+/g, '-');
            b.className = 'pixel-bubble';

            // Use percentage coordinates so it scales responsively on any screen!
            const pctX = (posX / 960) * 100;
            const pctY = (posY / 540) * 100;
            b.style.left = `${pctX}%`;
            b.style.top = `${pctY}%`;

            b.innerHTML = `
                <div class="bubble-speaker">
                    <span>🎬</span> ${char.name}
                </div>
                <div class="bubble-text">${text}</div>
            `;

            bubbleLayer.appendChild(b);
            playBlip(520, 'sine', 0.08);

            // Auto fade-out and remove
            setTimeout(() => {
                b.classList.add('fade-out');
                setTimeout(() => {
                    if (b.parentNode) b.remove();
                }, 300);
            }, durationMs);
        }

        /* =========================================================================
           SEAT OCCUPANCY & AI
           ========================================================================= */

        function setupCinemaOccupants() {
            SEATS.forEach(s => s.occ = null);

            // Seat my character
            const mySeat = SEATS[myCharacter.seatIndex !== undefined ? myCharacter.seatIndex : 9];
            if (mySeat) {
                mySeat.occ = myCharacter;
                myCharacter.state = 'sitting';
            }

            // Seat community characters
            COMMUNITY_CHARACTERS.forEach(bot => {
                const s = SEATS[bot.seatIndex];
                if (s && !s.occ) {
                    s.occ = bot;
                    bot.state = 'sitting';
                    bot.x = s.x + 28;
                    bot.y = s.y;
                }
            });
        }

        // Autonomous community speech and events
        setInterval(() => {
            const allChars = [myCharacter, ...COMMUNITY_CHARACTERS].filter(c => c.state === 'sitting');
            if (allChars.length === 0) return;

            const randomChar = allChars[Math.floor(Math.random() * allChars.length)];

            if (Math.random() < 0.45) {
                if (randomChar.quote) {
                    triggerSpeech(randomChar, randomChar.quote);
                }
            } else if (Math.random() < 0.3) {
                playPopcornCrunch();
            }
        }, 4500);

        // Restroom Trip Event
        function triggerRestroomTrip(char) {
            if (!char || char.state !== 'sitting') return;
            triggerSpeech(char, "Voy al baño, guardadme el sitio...", 3000);

            const seat = SEATS[char.seatIndex];
            seat.occ = null;
            char.state = 'walking_to_bath';
            char.x = seat.x + 28;
            char.y = seat.y + 10;

            const walkInterval = setInterval(() => {
                if (Math.abs(char.x - 480) > 6) {
                    char.x += char.x < 480 ? 4 : -4;
                } else if (char.y < 530) {
                    char.y += 4;
                } else {
                    clearInterval(walkInterval);
                    char.state = 'in_bath';

                    setTimeout(() => {
                        char.state = 'walking_back';
                        char.accessory = 'popcorn';
                        char.x = 480;
                        char.y = 530;
                        triggerSpeech(char, "¡Ya he vuelto! Traigo más palomitas 🍿", 3500);

                        const returnInterval = setInterval(() => {
                            if (char.y > seat.y + 10) {
                                char.y -= 4;
                            } else if (Math.abs(char.x - (seat.x + 28)) > 6) {
                                char.x += char.x < (seat.x + 28) ? 4 : -4;
                            } else {
                                clearInterval(returnInterval);
                                char.state = 'sitting';
                                seat.occ = char;
                            }
                        }, 50);
                    }, 5000);
                }
            }, 50);
        }

        function triggerRandomEvent() {
            const availableBots = COMMUNITY_CHARACTERS.filter(b => b.state === 'sitting');
            if (availableBots.length > 0) {
                const chosen = availableBots[Math.floor(Math.random() * availableBots.length)];
                triggerRestroomTrip(chosen);
            }
        }

        function sendCustomQuote() {
            const input = document.getElementById('hud-chat-input');
            const text = input.value.trim();
            if (!text) return;

            myCharacter.quote = text;
            triggerSpeech(myCharacter, text, 5500);
            input.value = '';

            try {
                localStorage.setItem('cineflix_16bit_avatar', JSON.stringify(myCharacter));
            } catch(e) {}
        }

        document.getElementById('hud-chat-input')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendCustomQuote();
        });

        // Click on Seats in Cinema
        cinemaCanvas.addEventListener('click', (e) => {
            const rect = cinemaCanvas.getBoundingClientRect();
            const scaleX = 960 / rect.width;
            const scaleY = 540 / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            SEATS.forEach(seat => {
                if (clickX >= seat.x - 6 && clickX <= seat.x + 62 && clickY >= seat.y - 12 && clickY <= seat.y + 44) {
                    if (seat.occ) {
                        triggerSpeech(seat.occ, seat.occ.quote || `¡Hola! Soy ${seat.occ.name}.`);
                    } else {
                        const oldSeat = SEATS[myCharacter.seatIndex];
                        if (oldSeat) oldSeat.occ = null;
                        seat.occ = myCharacter;
                        myCharacter.seatIndex = seat.id;
                        triggerSpeech(myCharacter, "¡Me cambio a este sitio!", 2500);
                        playBlip(659, 'sine', 0.1);
                        try {
                            localStorage.setItem('cineflix_16bit_avatar', JSON.stringify(myCharacter));
                        } catch(e) {}
                    }
                }
            });
        });

        /* =========================================================================
           CHARACTER STUDIO (CREATOR) CONTROLS
           ========================================================================= */

        const previewCanvas = document.getElementById('preview-canvas');
        const previewCtx = previewCanvas.getContext('2d');
        previewCtx.imageSmoothingEnabled = false;

        const hudAvatarCanvas = document.getElementById('hud-avatar-canvas');
        const hudAvatarCtx = hudAvatarCanvas.getContext('2d');
        hudAvatarCtx.imageSmoothingEnabled = false;

        let previewBlink = false;
        setInterval(() => {
            previewBlink = true;
            renderCreatorPreview();
            setTimeout(() => {
                previewBlink = false;
                renderCreatorPreview();
            }, 180);
        }, 3200);

        function renderCreatorPreview() {
            previewCtx.clearRect(0, 0, 240, 240);

            // Draw character standing in center with scale = 5 (24x34 * 5 = 120x170)
            draw16BitCharacterCrisp(previewCtx, myCharacter, 60, 32, 5, {
                isSitting: false,
                animFrame: 0,
                isChewing: false,
                blink: previewBlink
            });

            // HUD Mini Avatar (64x64 scaled down)
            hudAvatarCtx.clearRect(0, 0, 64, 64);
            draw16BitCharacterCrisp(hudAvatarCtx, myCharacter, 8, 2, 2, {
                isSitting: false,
                animFrame: 0,
                blink: false
            });

            document.getElementById('preview-name').textContent = myCharacter.name || 'Crono';
            document.getElementById('preview-quote').textContent = `"${myCharacter.quote || '...'}"`;
        }

        function initCreatorOptions() {
            // 1. Skin Palette
            const skinCont = document.getElementById('skin-palette');
            skinCont.innerHTML = '';
            SKIN_PALETTE.forEach(color => {
                const el = document.createElement('div');
                el.className = 'color-circle' + (myCharacter.skin === color ? ' selected' : '');
                el.style.backgroundColor = color;
                el.onclick = () => {
                    myCharacter.skin = color;
                    skinCont.querySelectorAll('.color-circle').forEach(c => c.classList.remove('selected'));
                    el.classList.add('selected');
                    renderCreatorPreview();
                };
                skinCont.appendChild(el);
            });

            // 2. Hair Styles
            const hairStyleCont = document.getElementById('hair-style-grid');
            hairStyleCont.innerHTML = '';
            HAIR_STYLES.forEach(style => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn' + (myCharacter.hairStyle === style.id ? ' selected' : '');
                btn.innerHTML = `<span class="choice-icon">${style.icon}</span><span>${style.name}</span>`;
                btn.onclick = () => {
                    myCharacter.hairStyle = style.id;
                    hairStyleCont.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    renderCreatorPreview();
                };
                hairStyleCont.appendChild(btn);
            });

            // 3. Hair Palette
            const hairPalCont = document.getElementById('hair-palette');
            hairPalCont.innerHTML = '';
            HAIR_PALETTE.forEach(color => {
                const el = document.createElement('div');
                el.className = 'color-circle' + (myCharacter.hairColor === color ? ' selected' : '');
                el.style.backgroundColor = color;
                el.onclick = () => {
                    myCharacter.hairColor = color;
                    hairPalCont.querySelectorAll('.color-circle').forEach(c => c.classList.remove('selected'));
                    el.classList.add('selected');
                    renderCreatorPreview();
                };
                hairPalCont.appendChild(el);
            });

            // 4. Top Styles
            const topCont = document.getElementById('top-style-grid');
            topCont.innerHTML = '';
            TOP_STYLES.forEach(style => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn' + (myCharacter.topStyle === style.id ? ' selected' : '');
                btn.innerHTML = `<span class="choice-icon">${style.icon}</span><span>${style.name}</span>`;
                btn.onclick = () => {
                    myCharacter.topStyle = style.id;
                    topCont.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    renderCreatorPreview();
                };
                topCont.appendChild(btn);
            });

            // 5. Top Palette
            const topPalCont = document.getElementById('top-palette');
            topPalCont.innerHTML = '';
            TOP_PALETTE.forEach(color => {
                const el = document.createElement('div');
                el.className = 'color-circle' + (myCharacter.topColor === color ? ' selected' : '');
                el.style.backgroundColor = color;
                el.onclick = () => {
                    myCharacter.topColor = color;
                    topPalCont.querySelectorAll('.color-circle').forEach(c => c.classList.remove('selected'));
                    el.classList.add('selected');
                    renderCreatorPreview();
                };
                topPalCont.appendChild(el);
            });

            // 6. Accessories
            const accCont = document.getElementById('accessory-grid');
            accCont.innerHTML = '';
            ACCESSORIES.forEach(acc => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn' + (myCharacter.accessory === acc.id ? ' selected' : '');
                btn.innerHTML = `<span class="choice-icon">${acc.icon}</span><span>${acc.name}</span>`;
                btn.onclick = () => {
                    myCharacter.accessory = acc.id;
                    accCont.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    renderCreatorPreview();
                };
                accCont.appendChild(btn);
            });

            document.getElementById('input-char-name').value = myCharacter.name || 'Crono';
            document.getElementById('input-char-quote').value = myCharacter.quote || '';
        }

        function updateProfileMeta() {
            myCharacter.name = document.getElementById('input-char-name').value.trim() || 'Crono';
            myCharacter.quote = document.getElementById('input-char-quote').value.trim() || '...';
            renderCreatorPreview();
        }

        function randomizeCharacter() {
            myCharacter.skin = SKIN_PALETTE[Math.floor(Math.random() * SKIN_PALETTE.length)];
            myCharacter.hairStyle = HAIR_STYLES[Math.floor(Math.random() * HAIR_STYLES.length)].id;
            myCharacter.hairColor = HAIR_PALETTE[Math.floor(Math.random() * HAIR_PALETTE.length)];
            myCharacter.topStyle = TOP_STYLES[Math.floor(Math.random() * TOP_STYLES.length)].id;
            myCharacter.topColor = TOP_PALETTE[Math.floor(Math.random() * TOP_PALETTE.length)];
            myCharacter.accessory = ACCESSORIES[Math.floor(Math.random() * ACCESSORIES.length)].id;

            initCreatorOptions();
            renderCreatorPreview();
            playBlip(784, 'triangle', 0.1);
        }

        function saveAndEnterCinema() {
            updateProfileMeta();
            try {
                localStorage.setItem('cineflix_16bit_avatar', JSON.stringify(myCharacter));
            } catch(e) {}

            setupCinemaOccupants();
            switchView('cinema');
            triggerSpeech(myCharacter, "¡Ya estoy en mi butaca!", 3500);
            playBlip(880, 'sine', 0.15);
        }

        function exportAvatarPNG() {
            const expCanvas = document.createElement('canvas');
            expCanvas.width = 256;
            expCanvas.height = 256;
            const expCtx = expCanvas.getContext('2d');
            expCtx.imageSmoothingEnabled = false;

            draw16BitCharacterCrisp(expCtx, myCharacter, 48, 16, 6, {
                isSitting: false
            });

            const link = document.createElement('a');
            link.download = `avatar_16bit_${myCharacter.name.toLowerCase().replace(/\s+/g, '_')}.png`;
            link.href = expCanvas.toDataURL();
            link.click();
        }

        function switchView(viewName) {
            const cinemaView = document.getElementById('view-cinema');
            const creatorView = document.getElementById('view-creator');
            const btnCinema = document.getElementById('btn-tab-cinema');
            const btnCreator = document.getElementById('btn-tab-creator');

            if (viewName === 'cinema') {
                cinemaView.classList.remove('hidden');
                creatorView.classList.add('hidden');
                btnCinema.classList.add('active');
                btnCreator.classList.remove('active');
            } else {
                cinemaView.classList.add('hidden');
                creatorView.classList.remove('hidden');
                btnCinema.classList.remove('active');
                btnCreator.classList.add('active');
                renderCreatorPreview();
            }
        }

        // Main Animation Loop
        let startTime = Date.now();
        function animationLoop() {
            const elapsed = Date.now() - startTime;
            drawCinemaSala(cinemaCtx, elapsed);
            requestAnimationFrame(animationLoop);
        }

        // Initialize Everything
        initCreatorOptions();
        setupCinemaOccupants();
        renderCreatorPreview();
        animationLoop();

        // Welcome speech bubble
        setTimeout(() => {
            triggerSpeech(myCharacter, myCharacter.quote || "Callaos todos que empieza la película 🤫", 5000);
        }, 1200);
    </script>
