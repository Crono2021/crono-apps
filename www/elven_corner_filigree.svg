<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="elvenGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="80%" stop-color="#e2b755"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="elvenSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d4e4f7"/>
      <stop offset="100%" stop-color="#8ba8cf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer curved bracket -->
  <path d="M 4 58 V 22 C 4 12 12 4 22 4 H 58" stroke="url(#elvenSilver)" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Inner delicate filigree curve -->
  <path d="M 12 52 V 26 C 12 18 18 12 26 12 H 52" stroke="url(#elvenGold)" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Vine scroll tendril -->
  <path d="M 14 36 C 14 22 22 14 36 14 C 44 14 48 18 48 22 C 48 26 44 28 40 26 C 36 24 38 18 42 18" stroke="url(#elvenGold)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- Corner Leaf Motif -->
  <path d="M 12 12 C 16 6 24 6 28 10 C 24 18 16 16 12 12 Z" fill="url(#elvenGold)" opacity="0.9"/>
  <path d="M 12 12 C 6 16 6 24 10 28 C 18 24 16 16 12 12 Z" fill="url(#elvenGold)" opacity="0.9"/>

  <!-- Little star at the corner apex -->
  <circle cx="10" cy="10" r="1.8" fill="#ffffff" filter="url(#glow)"/>
</svg>
